name: Newest dependencies

# CI installs what uv.lock pins: the versions that were current when the lock
# was last written. Someone who installs the package gets the newest versions
# that the requirements in pyproject.toml allow. This runs the unit tests
# against those, on every push and once a week, so that an upstream release
# that breaks something is noticed even when nobody pushes.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC

concurrency:
  group: newest-deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.0"
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    name: tests, newest dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Put Windows' own OpenSSH client first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:SystemRoot\System32\OpenSSH"
      - run: python -m pip install --disable-pip-version-check uv==${{ env.UV_VERSION }}
      # --upgrade resolves anew instead of taking the versions in uv.lock
      - run: uv sync --extra dev --upgrade --python 3.13
      - name: What was installed
        run: uv pip list --python .venv
      - run: uv run --no-sync pytest tests/ -v
